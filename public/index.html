<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Server Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🖥️ Server Dashboard</h1>
    <div class="topbar-right">
      <span id="hostInfo" class="muted">Đang kết nối...</span>
      <span id="statusDot" class="status-dot offline" title="Trạng thái kết nối"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="live">Trực tiếp</button>
    <button class="tab-btn" data-tab="history">Lịch sử</button>
  </nav>

  <main id="tab-live" class="grid">
    <section class="card">
      <h2>CPU</h2>
      <div class="big-metric">
        <span id="cpuLoad">--</span><span class="unit">%</span>
      </div>
      <canvas id="cpuChart" height="60"></canvas>
      <div id="cpuCores" class="core-bars"></div>
      <div class="row">
        <span class="muted">Nhiệt độ CPU</span>
        <span id="cpuTemp">--</span>
      </div>
      <canvas id="tempChart" height="40"></canvas>
      <div class="row">
        <span class="muted">Model</span>
        <span id="cpuBrand">--</span>
      </div>
    </section>

    <section class="card">
      <h2>RAM</h2>
      <div class="big-metric">
        <span id="memPercent">--</span><span class="unit">%</span>
      </div>
      <canvas id="memChart" height="60"></canvas>
      <div class="row">
        <span class="muted">Đã dùng</span>
        <span id="memUsed">--</span>
      </div>
      <div class="row">
        <span class="muted">Tổng</span>
        <span id="memTotal">--</span>
      </div>
      <div class="row">
        <span class="muted">Swap</span>
        <span id="swapUsed">--</span>
      </div>
    </section>

    <section class="card">
      <h2>Ổ đĩa</h2>
      <div id="disks" class="disk-list"></div>
    </section>

    <section class="card">
      <h2>Mạng</h2>
      <div id="network" class="net-list"></div>
    </section>
  </main>

  <main id="tab-history" class="grid" hidden>
    <section class="card wide">
      <div class="history-header">
        <h2>Lịch sử</h2>
        <div class="range-picker">
          <button class="range-btn active" data-range="hour">Giờ (60 phút gần nhất)</button>
          <button class="range-btn" data-range="day">Ngày (24 giờ gần nhất)</button>
          <button class="range-btn" data-range="month">Tháng (30 ngày gần nhất)</button>
          <button class="range-btn" data-range="year">Năm (12 tháng gần nhất)</button>
        </div>
      </div>

      <h3>CPU (%)</h3>
      <div id="histCpuStats" class="chart-stats"></div>
      <div class="chart-wrap">
        <canvas id="histCpuChart" height="90"></canvas>
      </div>
      <div id="histCpuLabels" class="chart-labels"></div>

      <h3>RAM (%)</h3>
      <div id="histMemStats" class="chart-stats"></div>
      <div class="chart-wrap">
        <canvas id="histMemChart" height="90"></canvas>
      </div>
      <div id="histMemLabels" class="chart-labels"></div>

      <h3>Nhiệt độ CPU (°C)</h3>
      <div id="histTempStats" class="chart-stats"></div>
      <div class="chart-wrap">
        <canvas id="histTempChart" height="90"></canvas>
      </div>
      <div id="histTempLabels" class="chart-labels"></div>
    </section>
    <div id="chartTooltip" class="chart-tooltip" hidden></div>
  </main>

  <footer class="footer muted">
    Cập nhật lúc <span id="lastUpdate">--</span> · Uptime: <span id="uptime">--</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
